apiVersion: apps/v1
kind: Deployment

metadata:
  name: skillforge
  namespace: skillforge

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: skillforge

  template:
    metadata:
      labels:
        app: skillforge

    spec:
      containers:
        - name: skillforge
          image: sujatro123/skillforge:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"