apiVersion: apps/v1
kind: Deployment

metadata:
  name: skillforge-api
  namespace: skillforge

spec:
  replicas: 2

  selector:
    matchLabels:
      app: skillforge-api

  template:
    metadata:
      labels:
        app: skillforge-api

    spec:
      containers:
        - name: skillforge-api
          image: sujatro123/skillforge-api:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"